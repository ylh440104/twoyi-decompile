name: bionic runtime probe

# Step 2 of the bionic route: the Termux bootstrap is a bionic userland, but its
# binaries need the bionic loader as INTERP.  Termux puts it at
#     $PREFIX/lib/ld-android.so
# and the loader understands `--library-path`, so a bionic binary can run on a
# glibc host without patching anything:
#     ld-android.so --library-path $PREFIX/lib -- $PREFIX/bin/bash -c ...
#
# This job (a) prints PT_INTERP of the bionic bash, (b) locates ld-android.so and
# libc.so, (c) actually executes bash through that loader.

on:
  workflow_dispatch:
  push:
    paths:
      - 'dyn/**'
      - '.github/workflows/bionic.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get Termux bootstrap
        run: |
          set +e
          mkdir -p bionic-out work
          {
            echo "== host =="
            uname -m
            A="https://api.github.com/repos/termux/termux-packages/releases/latest"
            URL=$(curl -s --max-time 30 "$A" | python3 -c "import json,sys;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d.get('assets',[]) if a['name']=='bootstrap-aarch64.zip'][0])" 2>/dev/null)
            echo "asset: $URL"
            [ -z "$URL" ] && URL="https://github.com/termux/termux-packages/releases/download/bootstrap-2024.10.24-r1/bootstrap-aarch64.zip"
            curl -fL --retry 2 -o work/tb.zip "$URL"
            echo "curl rc=$?"
            unzip -q -o work/tb.zip -d work/termux
            echo "unzip rc=$?"
            ls work/termux
          } >> bionic-out/probe.log 2>&1

      - name: Locate bionic loader and libs
        run: |
          set +e
          {
            echo "== lib dir =="
            ls work/termux/lib 2>/dev/null | head -40
            echo "== any loader / libc =="
            find work/termux \( -name 'ld-android.so' -o -name 'linker64' -o -name 'libc.so' -o -name 'libm.so' -o -name 'libdl.so' \) -printf '%p %s\n' 2>/dev/null | head -20
            echo "== PT_INTERP of the bionic bash =="
            python3 -c "import struct;d=open('work/termux/bin/bash','rb').read();ph=struct.unpack_from('<Q',d,0x20)[0];n=struct.unpack_from('<H',d,0x38)[0];print([d[struct.unpack_from('<Q',d,ph+i*56+8)[0]:][:120].split(chr(0).encode())[0].decode() for i in range(n) if struct.unpack_from('<I',d,ph+i*56)[0]==3])" 2>&1
          } >> bionic-out/probe.log 2>&1

      - name: Execute bionic bash through ld-android.so
        run: |
          set +e
          {
            P="$PWD/work/termux"
            L=$(find "$P" -name 'ld-android.so' | head -1)
            echo "PREFIX=$P"
            echo "LOADER=$L"
            if [ -n "$L" ]; then
              echo "== direct: loader --library-path =="
              "$L" --library-path "$P/lib" -- "$P/bin/bash" -c 'echo BIONIC_OK; uname -a; echo PREFIX=$PREFIX' 2>&1 | head -10
              echo "rc=$?"
            fi
            echo "== fallback: exec loader with argv[0]=bash =="
            if [ -n "$L" ]; then
              echo "skipped"
            fi
          } >> bionic-out/probe.log 2>&1

      - name: Commit
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A bionic-out
          if git diff --cached --quiet; then
            echo "nothing"
          else
            git commit -m "chore: bionic probe 2"
            git pull --rebase -q origin main || true
            git push || echo "push failed"
          fi