name: bionic load v2 (gcc + patchelf, no NDK)

# The NDK route failed (its download is ~700 MB and the job died in 37 s), so this
# job takes a much cheaper path that needs nothing but the host toolchain:
#
#   1. compile dyn/dumper.c with the native aarch64 gcc       (glibc ABI)
#   2. patchelf: retarget NEEDED  libc.so.6 -> libc.so
#                              libm.so.6 -> libm.so
#                              libdl.so.2 -> libdl.so
#                 and set INTERP to /system/bin/linker64
#   3. strip the GLIBC_x.y version requirements (retag DT_VERSYM/VERNEED/VERNEEDNUM)
#   4. execute it under dyn/bionic/system/bin/linker64 --library-path dyn/bionic/system/lib64
#
# Step 4 is the first time in this whole investigation that DT_ANDROID_RELA
# (APS2, 112,262 packed relocations) is actually understood by the loader, so
# .got / .init_array can become non-zero and the constructors can run.

on:
  workflow_dispatch:
  push:
    paths:
      - 'dyn/**'
      - '.github/workflows/bionic_load.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set +e
          mkdir -p bionic-out work
          {
            echo "== host =="
            uname -m
            gcc --version | head -1
            echo "== patchelf =="
            sudo apt-get update -qq
            sudo apt-get install -y -qq patchelf 2>&1 | tail -3
            patchelf --version 2>&1
          } >> bionic-out/load.log 2>&1

      - name: Build and retarget dumper
        run: |
          set +e
          {
            echo "== gcc build =="
            gcc -O2 -o dumper_glibc dyn/dumper.c -ldl
            echo "gcc rc=$?"
            ls -l dumper_glibc
            echo "== patchelf =="
            cp dumper_glibc dumper_bionic
            patchelf --replace-needed libc.so.6 libc.so dumper_bionic;   echo "needed libc rc=$?"
            patchelf --replace-needed libm.so.6 libm.so dumper_bionic;   echo "needed libm rc=$?"
            patchelf --replace-needed libdl.so.2 libdl.so dumper_bionic; echo "needed libdl rc=$?"
            patchelf --set-interpreter /system/bin/linker64 dumper_bionic; echo "interp rc=$?"
            echo "== strip glibc versions =="
            python3 dyn/strip_versions.py dumper_bionic dumper_bionic2
            echo "rc=$?"
            mv dumper_bionic2 dumper_bionic
            chmod +x dumper_bionic
            echo "== after =="
            readelf -d dumper_bionic 2>/dev/null | grep -E 'NEEDED|FLAGS' | head -8
            readelf -l dumper_bionic 2>/dev/null | grep -A1 INTERP | head -3
          } >> bionic-out/load.log 2>&1

      - name: Fetch libtwoyi.so
        run: |
          set +e
          {
            echo "== bionic tree =="
            ls -l dyn/bionic/system/bin dyn/bionic/system/lib64 2>&1
            chmod +x dyn/bionic/system/bin/linker64 dyn/bionic/system/bin/toybox dyn/bionic/system/bin/sh
            echo "== libtwoyi =="
            curl -fL --retry 2 -o work/libtwoyi.so \
              "https://github.com/ylh440104/twoyi-decompile/releases/download/native-0.7.5/libtwoyi.so"
            echo "curl rc=$?"
            sha256sum work/libtwoyi.so 2>&1
          } >> bionic-out/load.log 2>&1

      - name: "Sanity: can the bionic runtime execute anything?"
        run: |
          set +e
          B="$PWD/dyn/bionic"
          {
            echo "== sanity toybox =="
            "$B/system/bin/linker64" --library-path "$B/system/lib64" -- \
              "$B/system/bin/toybox" echo BIONIC_TOYBOX_OK 2>&1 | head -6
            echo "rc=$?"
            echo "== sanity sh =="
            "$B/system/bin/linker64" --library-path "$B/system/lib64" -- \
              "$B/system/bin/sh" -c 'echo BIONIC_SH_OK' 2>&1 | head -6
            echo "rc=$?"
            echo "== sanity: our dumper under bionic (no args) =="
            "$B/system/bin/linker64" --library-path "$B/system/lib64" -- \
              ./dumper_bionic 2>&1 | head -6
            echo "rc=$?"
          } >> bionic-out/load.log 2>&1

      - name: Run dumper under bionic linker
        run: |
          set +e
          B="$PWD/dyn/bionic"
          {
            echo "== phase init under bionic =="
            export ANDROID_ROOT="$B/system"
            "$B/system/bin/linker64" --library-path "$B/system/lib64" -- \
              ./dumper_bionic "$PWD/work/libtwoyi.so" "$PWD/bionic-out" init 2>&1 | head -40
            echo "rc=$?"
            echo "== slots =="
            cat bionic-out/init_slots.txt 2>/dev/null
            echo "== status =="
            cat bionic-out/init_status.txt 2>/dev/null
            echo "== files =="
            ls -la bionic-out
          } >> bionic-out/load.log 2>&1

      - name: Commit
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A bionic-out
          if git diff --cached --quiet; then
            echo "nothing"
          else
            git commit -m "chore: bionic load v2"
            git pull --rebase -q origin main || true
            git push || echo "push failed"
          fi