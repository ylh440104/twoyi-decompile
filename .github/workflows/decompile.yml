name: Decompile twoyi APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK download URL (release asset or any direct link)"
        required: false
        default: ""
  push:
    paths:
      - "apk/**"

permissions:
  contents: write

concurrency:
  group: decompile
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools (jadx, apktool, aapt2)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip p7zip-full file binutils
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          JADX_VER=1.5.0
          curl -fsSL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VER}/jadx-${JADX_VER}.zip"
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx jadx/bin/jadx-gui 2>/dev/null || true
          APKTOOL_VER=2.9.3
          curl -fsSL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar"
          printf '#!/usr/bin/env bash\nexec java -Xmx4g -jar %s/tools/apktool.jar "$@"\n' "$HOME" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          java -jar "$HOME/tools/apktool.jar" --version
          "$HOME/tools/jadx/bin/jadx" --version

      - name: Obtain APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euxo pipefail
          mkdir -p input
          if [ -n "${APK_URL:-}" ]; then
            echo "Downloading from provided URL"
            curl -fL --retry 3 -o input/twoyi.apk "$APK_URL"
          elif ls apk/*.apk >/dev/null 2>&1; then
            echo "Using APK committed under apk/"
            cp "$(ls apk/*.apk | head -n1)" input/twoyi.apk
          else
            echo "No APK: provide apk_url input or commit an APK under apk/"
            exit 1
          fi
          ls -la input/
          file input/twoyi.apk
          sha256sum input/twoyi.apk | tee input/twoyi.apk.sha256
          md5sum input/twoyi.apk | tee input/twoyi.apk.md5

      - name: Inspect APK contents
        run: |
          mkdir -p work
          python3 tools/inspect_apk.py input/twoyi.apk work/apk-list.txt

      - name: apktool decode (resources + smali + AndroidManifest)
        run: |
          set -euxo pipefail
          mkdir -p out
          apktool d -f -p out/apktool -o out/apktool-decoded input/twoyi.apk || \
          apktool d -f -p out/apktool input/twoyi.apk
          ls out/apktool-decoded | head -30
          du -sh out/apktool-decoded

      - name: jadx decode (Java sources)
        run: |
          set -euxo pipefail
          mkdir -p out/jadx
          JCP="$HOME/tools/jadx/lib/*"
          java -Xmx6g -cp "$JCP" jadx.cli.JadxCLI \
            --no-res --show-bad-code -d out/jadx input/twoyi.apk \
          || java -Xmx6g -cp "$JCP" jadx.cli.JadxCLI \
            -d out/jadx input/twoyi.apk
          find out/jadx -name '*.java' | wc -l
          du -sh out/jadx

      - name: Inventory report
        run: |
          set -euxo pipefail
          {
            echo "# Decompile inventory"
            echo
            echo "- APK: twoyi_0.7.5-11131322.apk"
            echo "- SHA256: $(cut -d' ' -f1 input/twoyi.apk.sha256)"
            echo "- MD5: $(cut -d' ' -f1 input/twoyi.apk.md5)"
            echo "- APK size: $(stat -c%s input/twoyi.apk) bytes"
            echo "- Java files: $(find out/jadx -name '*.java' | wc -l)"
            echo "- Smali files: $(find out/apktool-decoded -name '*.smali' | wc -l)"
            echo "- Native libs:"
            sed -n '/native libs:/,$p' work/apk-list.txt | tail -n +2 || echo "  (none listed)"
            echo "- Dex files:"
            sed -n '/^dex:/,/^$/p' work/apk-list.txt | tail -n +2 || echo "  (none listed)"
          } > INVENTORY.md
          cat INVENTORY.md

      - name: Pack artifacts
        run: |
          set -euxo pipefail
          cd out
          7z a -mx=1 -mmt=4 ../jadx-sources.7z jadx >/dev/null
          7z a -mx=1 -mmt=4 ../apktool-decoded.7z apktool-decoded >/dev/null
          cd ..
          ls -la *.7z

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-decompile-output
          path: |
            jadx-sources.7z
            apktool-decoded.7z
            INVENTORY.md
          retention-days: 30

      - name: Commit decoded tree back to repo
        run: |
          set -euxo pipefail
          rm -rf decompiled || true
          mkdir -p decompiled
          cp -a out/jadx decompiled/jadx
          cp -a out/apktool-decoded decompiled/apktool
          # Large binary payloads (rootfs image, natives) stay in the artifact only:
          # GitHub rejects any single file over 100 MB.
          rm -rf decompiled/apktool/assets decompiled/apktool/lib decompiled/apktool/unknown
          find decompiled -type f -size +90M -print -delete || true
          cp INVENTORY.md decompiled/INVENTORY.md
          echo "tracked files: $(find decompiled -type f | wc -l)"
          echo "tree size: $(du -sh decompiled | cut -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A decompiled
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: decompiled output for twoyi_0.7.5-11131322"
            git push
          fi