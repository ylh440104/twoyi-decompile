name: Dynamic dump of libtwoyi.so (aarch64)

# Loads the real library, lets the dynamic linker relocate it, runs the 38
# constructors / JNI_OnLoad, and dumps what only exists at runtime:
#   * the 6 GOT slots that are 0 in the static image
#   * .data / .bss after relocation
# Everything is diffed against the static file image.
#
# Every step logs to dyn-out/run.log and the commit step runs with if: always(),
# so even a failure leaves the diagnostics in the repository.

on:
  workflow_dispatch:
  push:
    paths:
      - 'dyn/**'
      - '.github/workflows/dyndump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Init log
        run: |
          mkdir -p dyn-out
          {
            echo "== dyndump start $(date -u) =="
            uname -a
            lscpu | head -8
            python3 --version
          } > dyn-out/run.log 2>&1

      - name: Install aarch64 toolchain + qemu-user
        run: |
          set +e
          {
            echo "--- apt update"
            sudo apt-get update -qq
            echo "update rc=$?"
            echo "--- apt install"
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user-static
            echo "install rc=$?"
            echo "--- versions"
            aarch64-linux-gnu-gcc --version 2>&1 | head -1
            qemu-aarch64-static --version 2>&1 | head -2
            which aarch64-linux-gnu-gcc qemu-aarch64-static
          } >> dyn-out/run.log 2>&1

      - name: Fetch libtwoyi.so
        run: |
          set +e
          {
            echo "--- curl"
            curl -fL --retry 2 -o work/libtwoyi.so \
              "https://github.com/ylh440104/twoyi-decompile/releases/download/native-0.7.5/libtwoyi.so"
            echo "curl rc=$?"
            ls -l work/libtwoyi.so
            sha256sum work/libtwoyi.so
          } >> dyn-out/run.log 2>&1

      - name: Build stubs and dumper
        run: |
          set +e
          {
            echo "--- stubs"
            mkdir -p stubs
            aarch64-linux-gnu-gcc -O2 -shared -fPIC -o stubs/libbionic_extra.so dyn/stubs.c
            echo "stub rc=$?"
            ln -sf /usr/aarch64-linux-gnu/lib/libc.so.6 stubs/libc.so
            ln -sf /usr/aarch64-linux-gnu/lib/libm.so.6 stubs/libm.so
            ln -sf /usr/aarch64-linux-gnu/lib/libdl.so.2 stubs/libdl.so
            ln -sf libbionic_extra.so stubs/libandroid.so
            ln -sf libbionic_extra.so stubs/liblog.so
            ls -l stubs
            echo "--- dumper"
            aarch64-linux-gnu-gcc -O2 -o dumper dyn/dumper.c -ldl
            echo "dumper rc=$?"
            file dumper
          } >> dyn-out/run.log 2>&1

      - name: Patch variants
        run: |
          set +e
          {
            echo "--- patch noinit"
            python3 dyn/patch_noinit.py work/libtwoyi.so work/libtwoyi_noinit.so --clear-now --clear-init
            echo "rc=$?"
            echo "--- patch lazy"
            python3 dyn/patch_noinit.py work/libtwoyi.so work/libtwoyi_lazy.so --clear-now
            echo "rc=$?"
            sha256sum work/*.so
          } >> dyn-out/run.log 2>&1

      - name: "Phase 1: relocate only (constructors disabled)"
        run: |
          set +e
          {
            echo "--- phase noinit"
            QEMU_LD_PREFIX=/usr/aarch64-linux-gnu LD_LIBRARY_PATH="$PWD/stubs" \
              qemu-aarch64-static ./dumper "$PWD/work/libtwoyi_noinit.so" "$PWD/dyn-out" noinit
            echo "rc=$?"
          } >> dyn-out/run.log 2>&1

      - name: "Phase 2: with constructors"
        run: |
          set +e
          {
            echo "--- phase init"
            QEMU_LD_PREFIX=/usr/aarch64-linux-gnu LD_LIBRARY_PATH="$PWD/stubs" \
              qemu-aarch64-static ./dumper "$PWD/work/libtwoyi_lazy.so" "$PWD/dyn-out" init
            echo "rc=$?"
          } >> dyn-out/run.log 2>&1

      - name: "Phase 3: constructors + JNI_OnLoad"
        run: |
          set +e
          {
            echo "--- phase jni"
            QEMU_LD_PREFIX=/usr/aarch64-linux-gnu LD_LIBRARY_PATH="$PWD/stubs" \
              qemu-aarch64-static ./dumper "$PWD/work/libtwoyi_lazy.so" "$PWD/dyn-out" jni
            echo "rc=$?"
          } >> dyn-out/run.log 2>&1

      - name: Diff against static image
        run: |
          set +e
          {
            echo "--- compare"
            python3 dyn/compare.py work/libtwoyi.so dyn-out
            echo "rc=$?"
            echo "--- slots"
            cat dyn-out/*_slots.txt 2>/dev/null
            echo "--- status"
            cat dyn-out/*_status.txt 2>/dev/null
            echo "--- files"
            ls -la dyn-out
          } >> dyn-out/run.log 2>&1

      - name: Commit results
        if: always()
        run: |
          set +e
          echo "== dyndump end $(date -u) ==" >> dyn-out/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A dyn-out
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: dynamic dump log ($(date -u +%H%M))"
            git pull --rebase -q origin main || true
            git push || echo "push failed"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dyn-out
          path: dyn-out
          retention-days: 30