name: Dynamic dump of libtwoyi.so (aarch64)

# Runs on a NATIVE arm64 runner, so no qemu and no cross-compiler are needed:
# gcc produces an aarch64 binary that the host can execute directly.
#
# What it does:
#   1. download libtwoyi.so from the release
#   2. build a small "bionic extra" stub library (libandroid.so / liblog.so are
#      symlinked to it) and symlink libc/libm/libdl to the real glibc objects
#   3. dlopen libtwoyi.so in three phases:
#        noinit : constructors disabled, DT_BIND_NOW cleared  -> post-relocation
#        init   : constructors run
#        jni    : constructors + JNI_OnLoad with a fake JavaVM
#   4. read the 6 GOT slots that are 0 in the static image, dump .data/.bss
#   5. diff everything against the file image
#
# Every step appends to dyn-out/run.log and the commit step runs with
# if: always(), so even a failing run leaves its diagnostics in the repo.

on:
  workflow_dispatch:
  push:
    paths:
      - 'dyn/**'
      - '.github/workflows/dyndump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Init log
        run: |
          mkdir -p dyn-out
          {
            echo "== dyndump start $(date -u) =="
            uname -a
            uname -m
            python3 --version
            gcc --version | head -1
          } > dyn-out/run.log 2>&1

      - name: Fetch libtwoyi.so
        run: |
          set +e
          {
            echo "--- curl"
            mkdir -p work dyn-out
            curl -fL --retry 2 -o work/libtwoyi.so \
              "https://github.com/ylh440104/twoyi-decompile/releases/download/native-0.7.5/libtwoyi.so"
            echo "curl rc=$?"
            ls -l work/libtwoyi.so
            sha256sum work/libtwoyi.so
          } >> dyn-out/run.log 2>&1

      - name: Build stubs and dumper
        run: |
          set +e
          {
            echo "--- stubs"
            mkdir -p stubs
            gcc -O2 -shared -fPIC -o stubs/libbionic_extra.so dyn/stubs.c
            echo "stub rc=$?"
            LIBC=$(gcc -print-file-name=libc.so.6)
            LIBM=$(gcc -print-file-name=libm.so.6)
            echo "LIBC=$LIBC  LIBM=$LIBM"
            ln -sf "$LIBC" stubs/libc.so
            ln -sf "$LIBM" stubs/libm.so
            ln -sf "$LIBC" stubs/libdl.so
            ln -sf libbionic_extra.so stubs/libandroid.so
            ln -sf libbionic_extra.so stubs/liblog.so
            ls -l stubs
            echo "--- dumper"
            gcc -O2 -o dumper dyn/dumper.c -ldl
            echo "dumper rc=$?"
            file dumper
          } >> dyn-out/run.log 2>&1

      - name: Patch variants
        run: |
          set +e
          {
            echo "--- patch noinit"
            python3 dyn/patch_noinit.py work/libtwoyi.so work/libtwoyi_noinit.so --clear-now --clear-init --clear-versions
            echo "rc=$?"
            echo "--- patch lazy"
            python3 dyn/patch_noinit.py work/libtwoyi.so work/libtwoyi_lazy.so --clear-now --clear-versions
            echo "rc=$?"
            sha256sum work/*.so
          } >> dyn-out/run.log 2>&1

      - name: "Phase 1: relocate only"
        run: |
          set +e
          {
            echo "--- phase noinit"
            LD_LIBRARY_PATH="$PWD/stubs" ./dumper "$PWD/work/libtwoyi_noinit.so" "$PWD/dyn-out" noinit
            echo "rc=$?"
          } >> dyn-out/run.log 2>&1

      - name: "Phase 2: with constructors"
        run: |
          set +e
          {
            echo "--- phase init"
            LD_LIBRARY_PATH="$PWD/stubs" ./dumper "$PWD/work/libtwoyi_lazy.so" "$PWD/dyn-out" init
            echo "rc=$?"
          } >> dyn-out/run.log 2>&1

      - name: "Phase 3: constructors + JNI_OnLoad"
        run: |
          set +e
          {
            echo "--- phase jni"
            LD_LIBRARY_PATH="$PWD/stubs" ./dumper "$PWD/work/libtwoyi_lazy.so" "$PWD/dyn-out" jni
            echo "rc=$?"
          } >> dyn-out/run.log 2>&1

      - name: Diff against static image
        run: |
          set +e
          {
            echo "--- compare"
            python3 dyn/compare.py work/libtwoyi.so dyn-out
            echo "rc=$?"
            echo "--- slots"
            cat dyn-out/*_slots.txt 2>/dev/null
            echo "--- status"
            cat dyn-out/*_status.txt 2>/dev/null
            echo "--- files"
            ls -la dyn-out
          } >> dyn-out/run.log 2>&1

      - name: Commit results
        if: always()
        run: |
          set +e
          echo "== dyndump end $(date -u) ==" >> dyn-out/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A dyn-out
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: dynamic dump log ($(date -u +%H%M))"
            git pull --rebase -q origin main || true
            git push || echo "push failed"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dyn-out
          path: dyn-out
          retention-days: 30