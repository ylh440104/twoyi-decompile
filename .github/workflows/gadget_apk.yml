name: twoyi + frida-gadget APK (v2)

# Builds an installable APK that loads frida-gadget before libtwoyi.so.
#
#   input   apkinput/part{a,b,c} = the 221,241,766 B twoyi 0.7.5 APK,
#           sha256 86ed3afa…db14f4e, reassembled and verified here
#   gadget  frida 17.28.1 android-arm64, 39,425,920 B, loaded from
#           TwoyiApplication.attachBaseContext so it precedes Renderer.<clinit>
#   script  assets/hook.js is copied to getFilesDir() by the patch, and gadget
#           reads it from /data/data/io.twoyi/files/hook.js — the only path the
#           app can both write and read under targetSdk 36
#   output  published as a release asset (a 220 MB artifact needs a login)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dyn/patch_app.py'
      - 'dyn/hook.js'
      - 'apkinput/parta*'
      - '.github/workflows/gadget_apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble and verify the input APK
        run: |
          set +e
          mkdir -p work out
          exec 1>build.log 2>&1
          ls -l apkinput/
          cat apkinput/parta* > work/twoyi.apk
          echo "cat rc=$?"
          ls -l work/twoyi.apk
          sha256sum work/twoyi.apk
          echo "expected 86ed3afaa447104f131d906c42ed8a07e207959c7869fda54bd245f62db14f4e"
          unzip -l work/twoyi.apk | grep -E 'classes.dex|libtwoyi|libgadget|hook.js'
          echo "== toolchain =="
          sudo apt-get update -qq
          curl -fsSL -o "$HOME/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar "$HOME/apktool.jar" --version
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          echo "BT=$BT"

      - name: Fetch gadget and write its config
        run: |
          set +e
          exec 1>>build.log 2>&1
          mkdir -p gadget
          curl -fsSL -o gadget/g.xz \
            https://github.com/frida/frida/releases/download/17.28.1/frida-gadget-17.28.1-android-arm64.so.xz
          echo "curl rc=$?"
          unxz -f gadget/g.xz
          mv gadget/g gadget/libgadget.so
          file gadget/libgadget.so
          python3 -c 'import json;open("gadget/libgadget.config.so","w").write(json.dumps({"interaction":{"type":"script","path":"/data/data/io.twoyi/files/hook.js","on_change":"reload"}}))'
          echo "cfg rc=$?"
          cat gadget/libgadget.config.so

      - name: Decode smali only
        run: |
          set +e
          exec 1>>build.log 2>&1
          java -Xmx6g -jar "$HOME/apktool.jar" d -f -r -o dec work/twoyi.apk
          echo "decode rc=$?"
          ls dec/apktool.yml && echo "apktool.yml present"
          find dec -name '*.smali' | wc -l

      - name: Inject gadget load into TwoyiApplication
        run: |
          set +e
          exec 1>>build.log 2>&1
          python3 dyn/patch_app.py dec
          echo "patch rc=$?"
          echo "== patched region =="
          sed -n '/attachBaseContext/,/gadget injection end/p' dec/smali/io/twoyi/TwoyiApplication.smali | head -40

      - name: Add gadget, config and hook.js to the tree
        run: |
          set +e
          exec 1>>build.log 2>&1
          mkdir -p dec/lib/arm64-v8a dec/assets
          cp gadget/libgadget.so gadget/libgadget.config.so dec/lib/arm64-v8a/
          cp dyn/hook.js dec/assets/hook.js
          ls -l dec/lib/arm64-v8a/ dec/assets/hook.js

      - name: Rebuild, align, sign
        run: |
          set +e
          exec 1>>build.log 2>&1
          java -Xmx6g -jar "$HOME/apktool.jar" b dec -o out/unsigned.apk --use-aapt2
          echo "build rc=$?"
          ls -l out/unsigned.apk
          if [ ! -f out/unsigned.apk ]; then echo "NO APK"; exit 0; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          keytool -genkeypair -keystore out/ks.jks -storepass android -keypass android \
            -alias k -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=gadget,O=t,C=cn" 2>&1 | tail -2
          "$BT/zipalign" -p -f 4 out/unsigned.apk out/aligned.apk
          echo "zipalign rc=$?"
          "$BT/apksigner" sign --ks out/ks.jks --ks-pass pass:android --key-pass pass:android \
            --out out/twoyi-gadget.apk out/aligned.apk
          echo "sign rc=$?"
          ls -l out/twoyi-gadget.apk
          "$BT/apksigner" verify --print-certs out/twoyi-gadget.apk | head -4
          unzip -l out/twoyi-gadget.apk | grep -E 'libgadget|hook.js'

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          exec 1>>build.log 2>&1
          if [ ! -f out/twoyi-gadget.apk ]; then echo "no apk"; else
            gh release view gadget-v2 >/dev/null 2>&1 || \
              gh release create gadget-v2 --title "twoyi 0.7.5 + frida-gadget" \
                --notes "Installs over io.twoyi 0.7.5. Launch it once; the gadget writes /sdcard/Download/twoyi_dump.txt." || true
            gh release upload gadget-v2 out/twoyi-gadget.apk --clobber
            echo "upload rc=$?"
          fi
          ls -l out/ 2>&1

      - name: Commit build log
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p apkout
          cp build.log apkout/build2.log 2>/dev/null
          git add -f apkout
          git diff --cached --quiet || { git commit -m "chore: gadget apk v2 build log"; git pull --rebase -q origin main || true; git push || true; }