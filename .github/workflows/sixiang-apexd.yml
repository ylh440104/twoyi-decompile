name: SiXiang T2 - apexd stub

# T2 的验收：
#   - 编译产物 file 显示 statically linked + ARM aarch64
#   - qemu-aarch64 下执行返回 0
#   - 源码里确实写 /apex/apexd.status = "success"（init 读的是文件，不是退出码）

on:
  workflow_dispatch:
  push:
    paths:
      - 'sixiang/apexd/**'
      - '.github/workflows/sixiang-apexd.yml'

permissions:
  contents: write

jobs:
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user-static binutils-aarch64-linux-gnu file

      - name: Build stub
        continue-on-error: true
        run: bash sixiang/apexd/build_stub.sh out 2>&1 | tee build.log

      - name: Extra check - 反汇编确认写文件
        continue-on-error: true
        run: |
          {
            echo '=== 反汇编中是否引用了 apexd.status ==='
            aarch64-linux-gnu-objdump -d out/apexd 2>/dev/null | wc -l
            echo
            echo '=== 字符串表里的路径 ==='
            strings out/apexd 2>/dev/null | grep -E 'apex|success' | head -10
            echo
            echo '=== 动态段（应为空）==='
            aarch64-linux-gnu-readelf -d out/apexd 2>/dev/null | head -8
          } | tee extra.log

      - name: Save result
        if: always()
        run: |
          mkdir -p sixiang/apexd/out
          cp -f build.log sixiang/apexd/out/build.log 2>/dev/null || true
          cp -f extra.log sixiang/apexd/out/extra.log 2>/dev/null || true
          if [ -f out/apexd ]; then
            cp -f out/apexd sixiang/apexd/out/apexd
            file sixiang/apexd/out/apexd > sixiang/apexd/out/file.txt
            sha256sum sixiang/apexd/out/apexd >> sixiang/apexd/out/file.txt
          fi
          ls -lh sixiang/apexd/out
          cat sixiang/apexd/out/file.txt 2>/dev/null

      - name: Commit
        if: always()
        run: |
          set +e
          git config user.name "sixiang-bot"
          git config user.email "sixiang@users.noreply.github.com"
          git add -f sixiang/apexd/out/* 2>/dev/null
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "sixiang T2: apexd stub build result"
          git pull --rebase -q origin main
          git push