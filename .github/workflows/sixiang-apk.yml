name: SiXiang APK

# Builds SiXiang.apk with the Android SDK command line tools only: no Gradle,
# no NDK, no JNI.
#
# Two details carry the design:
#   * the loader ships as lib/arm64-v8a/libmini_loader.so, so the system unpacks
#     it into /data/app/.../lib/arm64 where the label is apk_data_file -- a type
#     every app domain may execute (unlike app_data_file);
#   * the manifest targets API 28, which keeps the app in untrusted_app_27 and
#     therefore keeps exec/mmap(PROT_EXEC) working on filesDir, which the guest's
#     own linker64 needs for libc.so and friends.
#
# Everything is compiled here. The only thing left for the phone is: install,
# open, read the console.

on:
  workflow_dispatch:
  push:
    # Deliberately NOT 'sixiang/app/**': dist/ lives under it, and this job
    # commits dist/ back to main. That would make the workflow retrigger itself
    # forever.
    paths:
      - 'sixiang/app/src/**'
      - 'sixiang/app/res/**'
      - 'sixiang/app/AndroidManifest.xml'
      - 'sixiang/app/build.sh'
      - 'sixiang/guest/demo/**'
      - 'sixiang/jni/**'
      - 'sixiang/guest/dist/**'
      - '.github/workflows/sixiang-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (javac + apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (command line tools only)
        run: |
          set -uo pipefail
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-33" "build-tools;33.0.2" >/dev/null
          ls "$SDK/build-tools" "$SDK/platforms"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      # A static *glibc* helper cannot run inside an Android app: the app's
      # seccomp filter kills it with signal 31 before it prints a byte. Proved
      # on the emulator -- /system/bin/sh -> exit 0, our glibc loader -> 159 and
      # zero output, while the same binary runs fine as `shell`. bionic is what
      # the filter is written for, so the loader is built with the NDK.
      - name: Android NDK
        run: |
          set -uo pipefail
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --install \
              "ndk;26.1.10909125" >/dev/null
            NDK=$(ls -d "$ANDROID_SDK"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "SIXIANG_NDK_BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -5

      - name: Build the loader against bionic (aarch64, static)
        run: |
          set -uo pipefail
          CC=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          LOG=sixiang/loader/bin/build.log
          set +e
          "$CC" -O2 -static -s -Wall -Wextra \
              -o sixiang/loader/bin/mini_loader sixiang/loader/mini_loader.c 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          { file sixiang/loader/bin/mini_loader
            ls -l sixiang/loader/bin/mini_loader
          } >> "$LOG" 2>&1 || true
          exit $rc

      - name: Build the guest screen painter (aarch64, PIE)
        run: |
          set -uo pipefail
          mkdir -p sixiang/guest/dist
          CC=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          LOG=sixiang/guest/dist/screen-build.log
          set +e
          "$CC" -O2 -fPIE -pie -Wall -Wextra \
              -o sixiang/guest/dist/screen-arm64 sixiang/guest/demo/screen.c 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          { file sixiang/guest/dist/screen-arm64
            ls -l sixiang/guest/dist/screen-arm64
          } >> "$LOG" 2>&1 || true
          exit $rc

      - name: Need the loader and the guest bundle
        run: |
          set -uo pipefail
          # Both are produced by the other workflows and committed, so in the
          # normal case this is a no-op. Fail early with a clear message if not.
          test -f sixiang/loader/bin/mini_loader || \
            { echo "::error::mini_loader missing; run the loader workflow first"; exit 1; }
          test -f sixiang/guest/dist/sixiang-guest.zip || \
            { echo "::error::guest bundle missing; run the guest workflow first"; exit 1; }
          ls -l sixiang/loader/bin/mini_loader sixiang/guest/dist/sixiang-guest.zip

      - name: Build APK
        run: |
          set -uo pipefail
          mkdir -p sixiang/app/dist
          # GitHub runs steps with `bash -e`. Turn that off so a failing step
          # still leaves build.log behind for the report.
          set +e
          bash sixiang/app/build.sh "$ANDROID_SDK" \
            sixiang/keys/sixiang.jks sixiang2026 sixiang \
            2>&1 | tee sixiang/app/dist/build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            echo "::group::build.log tail"
            tail -40 sixiang/app/dist/build.log
            echo "::endgroup::"
            echo "::error::build.sh exited with $rc"
          fi
          exit $rc

      - name: Inspect APK
        if: always()
        run: |
          set -uo pipefail
          APK=sixiang/app/dist/SiXiang.apk
          test -f "$APK" || { echo "no apk"; exit 0; }
          BT=$(ls -d "$ANDROID_SDK"/build-tools/* | sort -V | tail -1)
          {
            echo "## badging"
            "$BT/aapt2" dump badging "$APK" 2>&1 | head -12 || true
            echo
            echo "## zip"
            unzip -l "$APK" | head -20 || true
            echo
            echo "## certs"
            "$BT/apksigner" verify --print-certs "$APK" | head -6 || true
          } | tee sixiang/app/dist/inspect.txt

      - name: Report
        if: always()
        run: |
          set -uo pipefail
          mkdir -p sixiang/app/dist
          {
            echo "# SiXiang.apk"
            echo
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## dist"
            echo '```'
            ls -l sixiang/app/dist 2>/dev/null || true
            echo '```'
            echo "## sha256"
            echo '```'
            sha256sum sixiang/app/dist/SiXiang.apk 2>/dev/null || echo "(no apk)"
            echo '```'
            echo "## build.log tail"
            echo '```'
            tail -60 sixiang/app/dist/build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } > sixiang/app/dist/report.md
          cat sixiang/app/dist/report.md

      - name: Commit results
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "sixiang-ci"
          git config user.email "ci@sixiang.invalid"
          git add -f sixiang/app/dist 2>/dev/null || true
          # The bionic loader built above is part of the deliverable: the APK
          # embeds it, and the repo copy is what other jobs use.
          git add -f sixiang/loader/bin 2>/dev/null || true
          git add -f sixiang/guest/dist 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "apk: SiXiang ${GITHUB_SHA::7}" || true
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo PUSHED
              exit 0
            fi
            echo "retry $i"
            sleep 6
          done
          echo "::warning::could not push results"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiXiang-apk
          path: sixiang/app/dist/
          if-no-files-found: warn
# (rebuild marker: guest screen painter assets)