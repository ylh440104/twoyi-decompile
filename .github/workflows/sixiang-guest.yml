name: SiXiang guest (bionic linker takes over)

# The question this answers
# -------------------------
# mini_loader maps a program and then jumps into the *guest's own* linker64 with
# AT_PHDR / AT_BASE, exactly the way the kernel does when it execs a dynamic
# binary. If that works, we get DT_NEEDED, symbol resolution, TLS and IFUNCs for
# free -- because the real linker does them, not us.
#
# The check is a real Android 17 binary: toybox from the official GSI, started
# with the GSI's own linker64 and libc.so.

on:
  workflow_dispatch:
  push:
    paths:
      - 'sixiang/guest/**'
      - 'sixiang/loader/**'
      - '.github/workflows/sixiang-guest.yml'

permissions:
  contents: write

jobs:
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu file unzip >/dev/null
          if ! sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1; then
            curl -fsSL -o /tmp/qemu-aarch64-static \
              https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-aarch64-static
            chmod +x /tmp/qemu-aarch64-static
            sudo cp /tmp/qemu-aarch64-static /usr/bin/qemu-aarch64-static
          fi
          qemu-aarch64-static --version | head -1

      - name: Build loader
        run: |
          bash sixiang/loader/build.sh
          file sixiang/loader/out/mini_loader

      - name: Assemble guest bundle (GSI -> linker64 + libc + toybox)
        run: bash sixiang/guest/make_bundle.sh

      - name: Run a real guest binary with the guest's own linker
        run: |
          set -uo pipefail
          set +e
          OUT=sixiang/guest/out
          LOG=$OUT/run.log
          : > "$LOG"

          echo "### interp run: linker64 + toybox" | tee -a "$LOG"
          LD_LIBRARY_PATH="$PWD/$OUT/system/lib64" \
          timeout 60 qemu-aarch64-static ./sixiang/loader/out/mini_loader \
              --interp "$PWD/$OUT/system/bin/linker64" \
              "$PWD/$OUT/system/bin/toybox" echo GUEST_TOYBOX_OK 2>&1 \
            | tee -a "$LOG"
          rc=${PIPESTATUS[0]}
          echo "exit=$rc" | tee -a "$LOG"

          echo | tee -a "$LOG"
          echo "### second run: toybox uname -a" | tee -a "$LOG"
          LD_LIBRARY_PATH="$PWD/$OUT/system/lib64" \
          timeout 60 qemu-aarch64-static ./sixiang/loader/out/mini_loader \
              --interp "$PWD/$OUT/system/bin/linker64" \
              "$PWD/$OUT/system/bin/toybox" uname -a 2>&1 | tee -a "$LOG"
          rc2=${PIPESTATUS[0]}
          echo "exit=$rc2" | tee -a "$LOG"

          echo "RC1=$rc RC2=$rc2" > "$OUT/rc.txt"

      - name: AOT inventory (does the GSI already ship precompiled code?)
        run: bash sixiang/aot/inventory.sh

      - name: Package for the device
        run: |
          OUT=sixiang/guest/out
          test -d "$OUT/dist" || { echo "dist missing"; exit 1; }
          rm -f /tmp/sixiang-guest.zip
          (cd "$OUT/dist" && zip -qr /tmp/sixiang-guest.zip .)
          ls -lh /tmp/sixiang-guest.zip
          mkdir -p sixiang/guest/dist
          cp -f /tmp/sixiang-guest.zip sixiang/guest/dist/sixiang-guest.zip
          unzip -l /tmp/sixiang-guest.zip | head -15
          rm -rf "$OUT/dist"   # do not commit the unpacked copy as well

      - name: Publish release asset (optional, public download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="guest-${GITHUB_SHA::7}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" /tmp/sixiang-guest.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "SiXiang guest bundle ${TAG}" \
            --notes "Android 17 bionic linker64 + libc + toybox + mini_loader. Unzip on the device and run ./run-on-device.sh from a shell that can load ELF (proot/Termux)."

      - name: Report
        if: always()
        run: |
          OUT=sixiang/guest/out
          {
            echo "# guest run report"
            echo
            echo "commit: $GITHUB_SHA"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            ls -l "$OUT/system/bin" 2>/dev/null || true
            echo "libs: $(find "$OUT/system/lib64" -maxdepth 1 -type f 2>/dev/null | wc -l)"
            echo '```'
            echo
            echo "## run"
            echo '```'
            cat "$OUT/run.log" 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "## dependency resolution"
            echo '```'
            cat "$OUT/libresolve.txt" 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            cat "$OUT/rc.txt" 2>/dev/null || true
          } > "$OUT/report.md"
          cat "$OUT/report.md"

      - name: Commit report
        if: always()
        run: |
          git config user.name  "sixiang-ci"
          git config user.email "ci@sixiang.invalid"
          mkdir -p sixiang/guest/out
          git add -f sixiang/guest/out 2>/dev/null || true
          git add -f sixiang/guest/dist 2>/dev/null || true
          git add -f sixiang/docs 2>/dev/null || true
          git commit -q -m "guest: run report ($GITHUB_SHA)" || echo "nothing to commit"
          # The loader workflow may push at the same moment; retry instead of
          # silently dropping the report on a non-fast-forward.
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && { echo PUSHED; break; }
            echo "retry $i"; sleep 6
          done