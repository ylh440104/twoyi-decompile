name: SiXiang kernel-wall probe (API 37 bionic on 4.19)

# 目的：回答一个决定性问题——
#   Android 17（API 37）的 bionic 在本机 kernel 4.19 上能不能跑起来。
#
# 手段：不下载整个世界，只从 GSI 抽出少数几个二进制，做静态判定：
#   1. libc.so / libc++.so 里是否存在 clone3(435) -> clone(220) 的 fallback
#   2. 是否存在 faccessat2(439) -> faccessat(48) 的 fallback
#   3. 是否硬依赖 mseal(462)
#   4. 抽出可执行文件供本机实跑（artifact 只有几 MB）
#
# 为什么这能在 Actions 里做：只是下载 + debugfs + objdump，不需要编译。

on:
  workflow_dispatch:
  push:
    paths:
      - 'sixiang/kwall/**'
      - '.github/workflows/sixiang-kwall.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs unzip file binutils zip

      - name: Download GSI
        run: |
          curl -fL --retry 3 -o gsi.zip \
            'https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-CP2A.260605.012-15430684-8e545e1e.zip'
          ls -l gsi.zip
          unzip -o gsi.zip -d gsi > /dev/null
          ls -lh gsi

      - name: Extract bionic binaries
        run: bash sixiang/kwall/extract.sh gsi

      - name: Analyse fallbacks
        run: bash sixiang/kwall/analyse.sh

      - name: Save results
        if: always()
        run: |
          mkdir -p sixiang/kwall/out
          cp -f kwall_report.txt sixiang/kwall/out/ 2>/dev/null || true
          cp -f kwall_analysis.txt sixiang/kwall/out/ 2>/dev/null || true
          ls -lh sixiang/kwall/out 2>/dev/null

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bionic-api37
          path: sixiang/kwall/out/
          retention-days: 30

      - name: Commit report
        if: always()
        run: |
          set +e
          git config user.name "sixiang-bot"
          git config user.email "sixiang@users.noreply.github.com"
          git add -f sixiang/kwall/out/*.txt 2>/dev/null
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "sixiang: kernel-wall probe (API37 bionic vs kernel 4.19)"
          git pull --rebase -q origin main
          git push
