name: SiXiang loader (no-exec ELF loader)

# What this proves
# ----------------
# The loader maps an aarch64 ET_DYN image into anonymous memory, relocates it,
# flips the text to PROT_EXEC and jumps. execve() is never called -- because on
# the target device it is refused for anything under an app's data directory.
#
# The self-test runs under qemu-user here so the algorithm is verified before
# anything reaches the phone. The binaries are uploaded as an artifact so the
# same loader can be run natively on the device (aarch64 -> aarch64, no qemu).

on:
  workflow_dispatch:
  push:
    paths:
      - 'sixiang/loader/**'
      - '.github/workflows/sixiang-loader.yml'

# The report step pushes its result back into the repo. Without this the token
# is read-only and every run looks "failed" with no way to read why.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu file >/dev/null
          aarch64-linux-gnu-gcc --version | head -1

      - name: Install qemu-user (for the self-test)
        run: |
          set -uo pipefail
          if sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1; then
            echo "qemu from apt"
          else
            echo "apt failed, downloading static build"
            curl -fsSL -o /tmp/qemu-aarch64-static \
              https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-aarch64-static
            chmod +x /tmp/qemu-aarch64-static
            sudo cp /tmp/qemu-aarch64-static /usr/bin/qemu-aarch64-static
          fi
          command -v qemu-aarch64-static
          qemu-aarch64-static --version | head -1

      - name: Build
        run: |
          set -uo pipefail
          mkdir -p sixiang/loader/out
          bash sixiang/loader/build.sh 2>&1 | tee sixiang/loader/out/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            echo "::group::build.log tail"
            tail -40 sixiang/loader/out/build.log
            echo "::endgroup::"
          fi
          exit $rc

      - name: Self-test (this is the result that matters)
        run: |
          set -uo pipefail
          mkdir -p sixiang/loader/out
          : > sixiang/loader/out/selftest.log

          run_one () {
            local name="$1"
            echo "### $name" | tee -a sixiang/loader/out/selftest.log
            timeout 30 qemu-aarch64-static ./sixiang/loader/out/mini_loader \
                "./sixiang/loader/out/$name" 2>&1 | tee -a sixiang/loader/out/selftest.log
            local rc=${PIPESTATUS[0]}
            echo "exit=$rc" | tee -a sixiang/loader/out/selftest.log
            echo | tee -a sixiang/loader/out/selftest.log
            LAST_RC=$rc
          }

          LAST_RC=99
          if [ -f sixiang/loader/out/hello_freestanding ]; then
            run_one hello_freestanding
            FS_RC=$LAST_RC
          else
            FS_RC=99
            echo "hello_freestanding missing" | tee -a sixiang/loader/out/selftest.log
          fi

          if [ -f sixiang/loader/out/hello_static_pie ]; then
            run_one hello_static_pie
            PIE_RC=$LAST_RC
          else
            PIE_RC=99
            echo "hello_static_pie not built (optional)" | tee -a sixiang/loader/out/selftest.log
          fi

          {
            echo "### verdict"
            echo "freestanding exit = $FS_RC   (0 = loader works, no libc needed)"
            echo "glibc        exit = $PIE_RC  (0 = loader also boots a second glibc)"
          } | tee -a sixiang/loader/out/selftest.log

          # The freestanding payload is the gate: if it does not exit 0 the
          # loader is broken. The glibc one is a bonus when it builds.
          test "$FS_RC" = "0"

      - name: Write report
        if: always()
        run: |
          OUT=sixiang/loader/out
          {
            echo "# loader build report"
            echo
            echo "commit: $GITHUB_SHA"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            ls -l $OUT 2>/dev/null || true
            echo
            file $OUT/* 2>/dev/null || true
            echo '```'
            echo
            echo "## self-test"
            echo '```'
            cat $OUT/selftest.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "## build log (compiler errors show up here)"
            echo '```'
            cat $OUT/build.log 2>/dev/null || echo "(no output)"
            echo '```'
          } > $OUT/report.md
          cat $OUT/report.md

      - name: Keep the report, drop the binaries
        if: always()
        run: |
          rm -f sixiang/loader/out/mini_loader \
                sixiang/loader/out/hello_static_pie \
                sixiang/loader/out/hello_freestanding
          git config user.name  "sixiang-ci"
          git config user.email "ci@sixiang.invalid"
          git add sixiang/loader/out || true
          git commit -q -m "loader: build + self-test report ($GITHUB_SHA)" || echo "nothing to commit"
          git pull --rebase -q origin main || true
          git push || echo "push skipped"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sixiang-loader
          path: |
            sixiang/loader/out/mini_loader
            sixiang/loader/out/hello_static_pie
            sixiang/loader/out/hello_freestanding
          if-no-files-found: warn