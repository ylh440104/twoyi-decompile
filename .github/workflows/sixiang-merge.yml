name: SiXiang T1 - rootfs merge (system + 38 APEX)

# T1 的验收：
#   - <out>/apex/ 下正好 38 个目录
#   - com.android.runtime/bin/linker64 存在
#   - com.android.art 存在
#   - system/apex 下的 38 个 .apex/.capex 原件已清空（否则白多 326 MB）
#
# 只回传文本报告，rootfs 本身不上传（2 GB 级，传不动）。

on:
  workflow_dispatch:
  push:
    paths:
      - 'sixiang/rootfs/merge_rootfs.py'
      - 'sixiang/apex/unpack.py'
      - '.github/workflows/sixiang-merge.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs unzip zstd

      - name: Cache GSI
        id: gsi
        uses: actions/cache@v4
        with:
          path: gsi.zip
          key: gsi-cp2a-260605012

      - name: Download GSI
        if: steps.gsi.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o gsi.zip \
            'https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-CP2A.260605.012-15430684-8e545e1e.zip'
          ls -l gsi.zip

      - name: Unzip
        run: |
          unzip -o gsi.zip -d gsi > /dev/null
          ls -lh gsi
          df -h / | tail -1

      - name: T1 - merge rootfs
        continue-on-error: true
        run: |
          python3 sixiang/rootfs/merge_rootfs.py gsi/system.img out 2>&1 | tee merge.log
          echo '--- disk after merge ---'
          df -h / | tail -1
          echo '--- tree ---'
          ls -1 out | head -20
          du -sh out/* 2>/dev/null | sort -rh | head -10

      - name: T3 - run init with qemu (chroot into rootfs)
        continue-on-error: true
        run: |
          set -x
          # qemu-user-static 在 runner 上装不上，直接拿 multiarch 的静态二进制
          curl -fL -o qemu-aarch64-static \
            'https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-aarch64-static'
          chmod +x qemu-aarch64-static
          file qemu-aarch64-static | head -1

          # 关键：chroot 进去，让 /init 看到的绝对路径都落在 out/ 里
          sudo cp qemu-aarch64-static out/qemu-aarch64-static
          ls -l out/init out/qemu-aarch64-static out/system/bin/init 2>&1

          echo '==================== run init ===================='
          # 40 秒超时；init 大概率中途失败，但要看它走到哪
          sudo timeout -s KILL 40 chroot out /qemu-aarch64-static /init > init-run.log 2>&1 || true
          wc -l init-run.log
          head -60 init-run.log
          echo '==================== end ========================'

      - name: T3b - run init with strace (syscall trace)
        continue-on-error: true
        run: |
          set -x
          sudo apt-get install -y --no-install-recommends strace || true
          # 记录 init 前 200 行 syscall，看它先碰什么
          sudo timeout -s KILL 30 strace -f -e trace=openat,mount,statfs,execve \
            -o /tmp/init.strace chroot out /qemu-aarch64-static /init 2>&1 | head -20 || true
          echo '--- strace 关键行 ---'
          grep -E 'apex|fstab|first_stage|mount\(' /tmp/init.strace 2>/dev/null | head -40 || echo '(no trace)'
          echo '--- 前 30 行 syscall ---'
          head -30 /tmp/init.strace 2>/dev/null || true

      - name: Save report
        if: always()
        run: |
          mkdir -p sixiang/rootfs/out
          cp -f merge.log sixiang/rootfs/out/merge.log 2>/dev/null || true
          cp -f out/merge-report.txt sixiang/rootfs/out/merge-report.txt 2>/dev/null || true
          cp -f init-run.log sixiang/rootfs/out/init-run.log 2>/dev/null || true
          cp -f /tmp/init.strace sixiang/rootfs/out/init.strace 2>/dev/null || true
          head -c 200000 /tmp/init.strace > sixiang/rootfs/out/init.strace.head 2>/dev/null || true
          {
            echo '=== out 顶层 ==='
            ls -1 out 2>/dev/null | head -20
            echo
            echo '=== 各部件大小 ==='
            du -sh out/* 2>/dev/null | sort -rh | head -10
            echo
            echo '=== apex 目录数 ==='
            ls -1 out/apex 2>/dev/null | wc -l
            echo
            echo '=== apex 前 10 ==='
            ls -1 out/apex 2>/dev/null | head -10
            echo
            echo '=== system/apex 残留原件数 ==='
            ls -1 out/system/apex 2>/dev/null | grep -cE '\.(apex|capex)$' || true
            echo
            echo '=== runtime/bin 内容 ==='
            ls -lh out/apex/com.android.runtime/bin 2>/dev/null | head -10
            echo
            echo '=== tar.zst ==='
            ls -lh rootfs.tar.zst 2>/dev/null || echo '(未生成)'
            echo
            echo '=== init 产物 ==='
            ls -l out/init out/first_stage_ramdisk/ 2>/dev/null
            echo
            echo '=== system/apex 目录数 ==='
            ls -1d out/system/apex/*/ 2>/dev/null | wc -l
          } > sixiang/rootfs/out/summary.txt
          cat sixiang/rootfs/out/summary.txt

      - name: Commit report
        if: always()
        run: |
          set +e
          git config user.name "sixiang-bot"
          git config user.email "sixiang@users.noreply.github.com"
          git add -f sixiang/rootfs/out/merge.log sixiang/rootfs/out/merge-report.txt sixiang/rootfs/out/summary.txt 2>/dev/null
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "sixiang T1: rootfs merge report"
          git pull --rebase -q origin main
          git push