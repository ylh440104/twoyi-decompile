name: SiXiang probe (version + runner capacity)

# 只读探测，不做任何构建。目标是把三个未知量固定成数字：
#   1. android-latest-release 实际指向哪个 Android 版本（有没有 16/17）
#   2. 这个 runner 的 CPU / 内存 / 磁盘到底够不够编 AOSP
#   3. ci.android.com 的预编译产物是否可达（Actions 全量编译不可行时的替代路）
#
# 注意：本文件里不允许出现 heredoc。上一版因为 `run: |` 块里嵌
# python3 - <<'PY' 且代码顶格，直接触发 "Invalid workflow file ... line 74"。
# 所以全部改成纯 shell 管道；不需要的步骤一律 `continue-on-error`。

on:
  workflow_dispatch:
  schedule:
    # 每天 03:17 UTC 查一次 AOSP 是否已把 Android 17（cp1a）推到主干
    - cron: '17 3 * * *'
  push:
    paths:
      - '.github/workflows/sixiang-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Runner capacity
        run: |
          set -x
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          free -g
          df -h /
          echo "--- AOSP 估算需求: 磁盘 >=250G, 4 核约 20-40h ---"

      - name: Android SDK present
        continue-on-error: true
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls /usr/local/lib/android/sdk 2>/dev/null || true
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || true
          ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null || true
          which sdkmanager apksigner zipalign 2>/dev/null || true

      - name: ci.android.com reachable
        continue-on-error: true
        run: |
          set -x
          for u in https://ci.android.com/ https://ci.android.com/builds/branches/aosp-main/status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$u" || echo ERR)
            echo "$code  $u"
          done

      - name: repo init android-latest-release
        run: |
          set -x
          git config --global user.name  "sixiang-probe"
          git config --global user.email "sixiang@users.noreply.github.com"
          git config --global color.ui false
          git config --global http.postBuffer 524288000
          mkdir -p /tmp/aosp
          cd /tmp/aosp
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod +x /tmp/repo
          /tmp/repo --version
          /tmp/repo init -u https://android.googlesource.com/platform/manifest -b android-latest-release --depth=1 --no-repo-verify 2>&1 | tail -25
          echo "=== manifests dir ==="
          ls -l .repo/manifests/ | head
          echo "=== default.xml size ==="
          wc -c .repo/manifests/default.xml

      - name: Extract platform/build revision
        id: rev
        run: |
          set -x
          cd /tmp/aosp
          REV=$(grep -oE '<project[^>]*name="platform/build"[^>]*>' .repo/manifests/default.xml \
                | head -1 \
                | grep -oE 'revision="[^"]+"' \
                | cut -d'"' -f2)
          echo "raw revision = [$REV]"
          REV=${REV#refs/heads/}
          REV=${REV#refs/tags/}
          if [ -z "$REV" ]; then REV="aosp-android-latest-release"; fi
          echo "usable = [$REV]"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "=== superproject line ==="
          grep -oE '<superproject[^>]*>' .repo/manifests/default.xml | head -1 || true

      - name: Read version from platform/build
        continue-on-error: true
        run: |
          set -x
          REV="${{ steps.rev.outputs.rev }}"
          rm -rf /tmp/build
          git clone --depth 1 -b "$REV" https://android.googlesource.com/platform/build /tmp/build 2>&1 | tail -6 \
            || git clone --depth 1 https://android.googlesource.com/platform/build /tmp/build 2>&1 | tail -6
          cd /tmp/build || exit 1
          echo "=== head ==="
          git log --oneline -1
          echo "=== PLATFORM_* in version_defaults.mk ==="
          grep -E 'PLATFORM_VERSION|PLATFORM_SDK_VERSION|PLATFORM_SECURITY_PATCH' \
            make/core/version_defaults.mk 2>/dev/null | head -12 || echo "(absent)"
          echo "=== release/ dir ==="
          ls release/ 2>/dev/null | head -20
          echo "=== release_config_map.textproto (head) ==="
          sed -n '1,40p' release/release_config_map.textproto 2>/dev/null || echo "(absent)"
          echo "=== any 3x SDK marker ==="
          grep -rE 'PLATFORM_SDK_VERSION[^0-9]*3[5-9]' --include='*.mk' . 2>/dev/null | head -5 || true

      - name: Manifest tags and heads
        continue-on-error: true
        run: |
          set -x
          echo "=== newest android-1x release tags ==="
          git ls-remote --tags https://android.googlesource.com/platform/manifest 2>/dev/null \
            | grep -oE 'android-1[0-9]+\.[0-9]+\.[0-9]+_r[0-9]+' | sort -u -V | tail -12
          echo "=== release-ish branches ==="
          git ls-remote --heads https://android.googlesource.com/platform/manifest 2>/dev/null \
            | grep -oE 'refs/heads/[a-z-]*latest[a-z-]*' | sort -u | tail -10

      - name: Check Android 17 availability (corrected)
        continue-on-error: true
        run: |
          set -x
          # 之前误判过一次：main 的 release_configs 只有 bp1a(16)，但 17 在独立 tag 上。
          # 正确判据 = manifest 是否有 android-17.0.0_r1 这个 ref/tag。
          echo '=== manifest 17 tags ==='
          curl -fsS --max-time 40 'https://android.googlesource.com/platform/manifest/+refs?format=JSON' \
            | tail -n +2 | tr ',' '\n' | grep -oE 'android-17\.0\.0_r[0-9]+' | sort -u | head -10
          echo '=== release config on that tag ==='
          curl -fsS --max-time 40 'https://android.googlesource.com/platform/build/release/+/android-17.0.0_r1/release_config_map.textproto?format=TEXT' \
            | base64 -d 2>/dev/null | head -8
          {
            echo "# Android 17 availability"
            echo ""
            echo "checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "判据一：manifest 是否存在 android-17.0.0_r1"
            curl -fsS --max-time 40 'https://android.googlesource.com/platform/manifest/+refs?format=JSON' \
              | tail -n +2 | tr ',' '\n' | grep -oE 'android-17\.0\.0_r[0-9]+' | sort -u || echo "(none)"
            echo ""
            echo "判据二：该 tag 的 release config（应为 cp2a）"
            curl -fsS --max-time 40 'https://android.googlesource.com/platform/build/release/+/android-17.0.0_r1/release_config_map.textproto?format=TEXT' \
              | base64 -d 2>/dev/null | head -8 || echo "(read failed)"
          } > sixiang/docs/AOSP17-STATUS.md

      - name: Summary
        run: |
          {
            echo "### SiXiang probe"
            echo ""
            echo "- runner: $(nproc) vCPU / $(free -g | awk '/^Mem:/{print $2}') GiB / $(df -h / | awk 'NR==2{print $4}') free"
            echo "- build revision: \`${{ steps.rev.outputs.rev }}\`"
            echo "- 版本号与 SDK 号见上一步日志；若 clone 失败则为 continue-on-error"
          } >> "$GITHUB_STEP_SUMMARY"